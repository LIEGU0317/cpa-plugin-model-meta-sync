name: Build

# Release assets follow the plugin-store contract (store/README.md):
#   <id>_<version>_<goos>_<goarch>.zip  with <id>.<ext> at the zip root
#   checksums.txt                       sha256sum format over every zip
# A tag push is all it takes to publish a new version: the store reads the
# repository's latest release, so registry.json never has to change.

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: model-meta-sync
  GO_VERSION_FILE: plugin/go.mod

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
          cache-dependency-path: plugin/go.sum

      - name: Version default matches the Makefile
        run: make version-check

      - name: Unit tests
        working-directory: plugin
        run: go test ./...

      - name: Vet
        working-directory: plugin
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
          cache-dependency-path: plugin/go.sum

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Build shared library
        working-directory: plugin
        run: |
          set -euo pipefail
          mkdir -p ../dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
              -o "../dist/${LIB_NAME}" .
          rm -f "../dist/${PLUGIN_ID}.h"

      - name: Package and verify plugin archive
        working-directory: plugin
        run: |
          set -euo pipefail
          go run ./cmd/zipdist -in "../dist/${LIB_NAME}" -name "${LIB_NAME}" -out "../dist/${ARCHIVE_NAME}"
          go run ./cmd/zipdist -verify "../dist/${ARCHIVE_NAME}" -name "${LIB_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/*.zip
          if-no-files-found: error

  # Platform proof: the archive is loaded by a real CLIProxyAPI binary for the
  # same platform, then registers, syncs a mock upstream and hot-reloads.
  # darwin entries are informational (an unsigned dylib may be refused by a
  # hardened-runtime host) and never block a release.
  smoke:
    name: Smoke ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
            cpa_os: linux
            cpa_arch: amd64
            cpa_bin: cliproxyapi
            optional: false
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
            cpa_os: linux
            cpa_arch: aarch64
            cpa_bin: cliproxyapi
            optional: false
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
            cpa_os: windows
            cpa_arch: amd64
            cpa_bin: cliproxyapi.exe
            optional: false
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
            cpa_os: darwin
            cpa_arch: amd64
            cpa_bin: cliproxyapi
            optional: true
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
            cpa_os: darwin
            cpa_arch: aarch64
            cpa_bin: cliproxyapi
            optional: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Fetch CLIProxyAPI for ${{ matrix.cpa_os }}/${{ matrix.cpa_arch }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo router-for-me/CLIProxyAPI --json tagName -q .tagName)"
          version="${tag#v}"
          mkdir -p cpa
          gh release download "${tag}" --repo router-for-me/CLIProxyAPI \
            --pattern "CLIProxyAPI_${version}_${{ matrix.cpa_os }}_${{ matrix.cpa_arch }}.tar.gz" \
            --pattern "CLIProxyAPI_${version}_${{ matrix.cpa_os }}_${{ matrix.cpa_arch }}.zip" \
            --dir cpa || true
          cd cpa
          for archive in *.tar.gz; do [[ -e "${archive}" ]] && tar -xzf "${archive}"; done
          for archive in *.zip; do [[ -e "${archive}" ]] && unzip -o -q "${archive}"; done
          bin="$(find . -maxdepth 3 -type f -name '${{ matrix.cpa_bin }}' | head -1)"
          if [[ -z "${bin}" ]]; then
            echo "CLIProxyAPI ${tag} has no ${{ matrix.cpa_os }}/${{ matrix.cpa_arch }} binary" >&2
            ls -la >&2
            exit 1
          fi
          chmod +x "${bin}"
          echo "CPA_BIN=$(cd "$(dirname "${bin}")" && pwd)/$(basename "${bin}")" >> "${GITHUB_ENV}"

      - name: Smoke test the built plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: ./scripts/smoke-test.sh

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
          cache-dependency-path: plugin/go.sum

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums.txt
        working-directory: plugin
        run: go run ./cmd/zipdist -checksums ../dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "Automated release for ${GITHUB_REF_NAME}."
          fi
